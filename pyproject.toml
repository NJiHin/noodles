[project]
name = "noodles"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.151.0",
    "httpx>=0.28.1",
    "openai>=3.35.1",
    "opendataloader-pdf>=2.5.13",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "poethepoet>=0.49.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "reportlab>=5.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"

# Dev servers: `uv run poe dev`, `uv run poe canvas`, `uv run poe stop`. Backends reload on code changes.
[tool.poe.tasks.api]
help = "Backend on :8000 with .env (real models unless NOODLES_FAKE=1)"
cmd = "uvicorn noodles.api:from_env --factory --port 8000 --reload --reload-dir noodles"
envfile = ".env"

[tool.poe.tasks.web]
help = "Front end on :5173, proxying to :8000"
cmd = "npm run dev"
cwd = "frontend"

[tool.poe.tasks.dev]
help = "Backend and front end together"
parallel = ["api", "web"]

[tool.poe.tasks.canvas-api]
help = "Fake-model backend on :8799 for the made canvas (seeded data in canvas/.seed)"
cmd = "uvicorn noodles.api:from_env --factory --port 8799 --reload --reload-dir noodles"
env = { NOODLES_FAKE = "1", NOODLES_DATA = "canvas/.seed/data", NOODLES_RUNS = "canvas/.seed/runs" }

[tool.poe.tasks.canvas-web]
help = "Front end on :5199 for the made canvas, proxying to :8799"
cmd = "npx vite --port 5199 --strictPort --host 127.0.0.1"
cwd = "frontend"
env = { NOODLES_API = "http://127.0.0.1:8799" }

[tool.poe.tasks.canvas]
help = "The app the made canvas captures (canvas/states.json)"
parallel = ["canvas-api", "canvas-web"]

[tool.poe.tasks.stop]
help = "Stop anything listening on the dev and canvas ports (8000, 5173, 8799, 5199)"
shell = "lsof -t -iTCP:8000 -iTCP:5173 -iTCP:8799 -iTCP:5199 -sTCP:LISTEN | xargs kill 2>/dev/null; true"
